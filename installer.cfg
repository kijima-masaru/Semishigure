# pynsist (MIT) configuration for the Windows installer.
# Build: python tools/build_windows.py   (downloads the Windows wheels, builds ours, runs pynsist)
[Application]
name=Semishigure
version=1.0.0
publisher=Semishigure
entry_point=semishigure.desktop:main
icon=assets/semishigure.ico
console=false
license_file=LICENSE

[Python]
version=3.12.10
bitness=64
include_msvcrt=true

[Shortcut Semishigure (コンソール)]
entry_point=semishigure.desktop:main_console
icon=assets/semishigure.ico
console=true

[Command semishigure]
entry_point=semishigure.cli:main

[Include]
# every runtime dependency as a wheel: tools/build_windows.py fills build/wheels
local_wheels=build/wheels/*.whl
files=THIRD_PARTY_NOTICES.md
      CHANGELOG.md

[Build]
directory=build/nsis
installer_name=Semishigure-1.0.0-setup.exe
