name: release-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ（例 v1.0.0）。空のときはインストーラを成果物として作るだけ"
        required: false
        default: ""
jobs:
  installer:
    # builds Semishigure-<version>-setup.exe (pynsist + NSIS, embedded Python 3.12) and
    # attaches it to the GitHub release of the tag
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" httpx pynsist
      - run: ruff check semishigure tests
      - run: pytest -q
      - name: Install NSIS (makensis)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: makensis /VERSION
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Semishigure-windows-installer
          path: build/nsis/*.exe
      - name: Smoke test the installer (silent install, launch the Start Menu target, reach the UI)
        shell: pwsh
        env:
          SEMISHIGURE_NO_BROWSER: "1"
        run: |
          $exe = (Get-ChildItem build/nsis/*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $inst = @("$env:LOCALAPPDATA\Programs\Semishigure", "$env:ProgramFiles\Semishigure") | Where-Object { Test-Path "$_\Semishigure.launch.pyw" } | Select-Object -First 1
          if (-not $inst) { Write-Error "install directory not found"; exit 1 }
          "installed in $inst"; Get-ChildItem $inst | Select-Object Name, Length
          $proc = Start-Process -FilePath "$inst\Python\pythonw.exe" -ArgumentList "`"$inst\Semishigure.launch.pyw`"" -PassThru
          $log = "$env:USERPROFILE\.semishigure\desktop.log"
          $url = $null
          foreach ($i in 1..40) {
            Start-Sleep 1
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern "starting on (http://[^ ]+)" | Select-Object -Last 1
              if ($m) { $url = $m.Matches[0].Groups[1].Value }
            }
            if ($url) { try { $r = Invoke-WebRequest "$($url)api/state" -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200) { break } } catch {} }
            if ($proc.HasExited) { break }
          }
          foreach ($f in @($log, "$env:APPDATA\Semishigure.launch.pyw.log")) { if (Test-Path $f) { "===== $f"; Get-Content $f } else { "(no file) $f" } }
          "launcher exited: $($proc.HasExited) code: $($proc.ExitCode)"
          if (-not $url) { Write-Error "no server URL in desktop.log"; exit 1 }
          if ($proc.HasExited) { Write-Error "the launcher exited instead of keeping the window open"; exit 1 }
          if (-not (Select-String -Path $log -Pattern "application window: " -Quiet)) { Write-Error "no application window was opened (see desktop.log above)"; exit 1 }
          $ui = Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 5
          if ($ui.Content -notmatch "Semishigure") { Write-Error "UI not served"; exit 1 }
          "UI reachable at $url (ui $($ui.Content.Length) bytes)"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name pythonw, python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $ver = python -c "import semishigure; print(semishigure.__version__)"
          if ($tag -ne "v$ver") { Write-Error "tag $tag does not match semishigure.__version__ $ver"; exit 1 }
      - uses: softprops/action-gh-release@v2
        # on a tag push: release for that tag; on a manual run with `tag`: creates the tag on the
        # selected ref (main) and the release in one go
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: build/nsis/*.exe
          generate_release_notes: true
