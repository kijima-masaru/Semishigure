name: release-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  installer:
    # builds Semishigure-<version>-setup.exe (pynsist + NSIS, embedded Python 3.12) and
    # attaches it to the GitHub release of the tag
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,desktop]" httpx pynsist
      - run: ruff check semishigure tests
      - run: pytest -q
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Semishigure-windows-installer
          path: build/nsis/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/nsis/*.exe
          generate_release_notes: true
