name: release-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ（例 v1.0.0）。空のときはインストーラを成果物として作るだけ"
        required: false
        default: ""
jobs:
  installer:
    # builds Semishigure-<version>-setup.exe (pynsist + NSIS, embedded Python 3.12) and
    # attaches it to the GitHub release of the tag
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,desktop]" httpx pynsist
      - run: ruff check semishigure tests
      - run: pytest -q
      - name: Install NSIS (makensis)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: makensis /VERSION
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Semishigure-windows-installer
          path: build/nsis/*.exe
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $ver = python -c "import semishigure; print(semishigure.__version__)"
          if ($tag -ne "v$ver") { Write-Error "tag $tag does not match semishigure.__version__ $ver"; exit 1 }
      - uses: softprops/action-gh-release@v2
        # on a tag push: release for that tag; on a manual run with `tag`: creates the tag on the
        # selected ref (main) and the release in one go
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: build/nsis/*.exe
          generate_release_notes: true
