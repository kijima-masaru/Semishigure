name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" httpx
      - run: ruff check semishigure tests
      - run: pytest -q
  test-windows:
    # the desktop release runs on Windows: the loopback tests (SIP / RTP / controller / API) must pass there too
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" httpx
      - run: pytest -q
  ui:
    # no horizontal scroll at 375 / 768 / 1440 px, no page errors, no serious axe-core violations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: npm install --no-audit --no-fund
        working-directory: tests/ui
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui
      - run: |
          SEMISHIGURE_HOME=/tmp/semi-home semishigure serve --port 8080 --scenarios examples --no-store &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/state >/dev/null && break; sleep 1; done
          node check_ui.mjs http://127.0.0.1:8080
        working-directory: tests/ui
