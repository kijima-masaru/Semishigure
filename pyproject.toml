[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semishigure"
version = "0.1.0"
description = "PBX (FreeSWITCH / Asterisk) concurrent-call load tester with a built-in SIP/RTP stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",          # MIT
    "cryptography>=42.0",   # Apache-2.0 / BSD-3-Clause
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",          # MIT
    "pytest-asyncio>=0.23", # Apache-2.0
    "ruff>=0.5",            # MIT
]

[project.scripts]
semishigure = "semishigure.cli:main"

[tool.setuptools.packages.find]
include = ["semishigure*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
