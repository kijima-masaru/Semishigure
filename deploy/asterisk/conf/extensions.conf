; Semishigure dev PBX dialplan (Asterisk)
[general]
static = yes
writeprotect = yes

[globals]
RING_GROUP = __RING_GROUP__
RING_GROUP_LIMIT = __RING_GROUP_LIMIT__
RING_GROUP_DIAL = __RING_GROUP_DIAL__

[default]
; Ring group entry number (design 9.1). Call limit with GROUP()/GROUP_COUNT(); the 21st call gets 486.
exten => _X.,1,NoOp()
 same => n,GotoIf($["${EXTEN}" = "${RING_GROUP}"]?ringgroup)
 same => n,GotoIf($["${EXTEN:0:1}${LEN(${EXTEN})}" = "94"]?local)
 same => n,Goto(${EXTEN},1)

exten => _X.,n(ringgroup),Set(GROUP()=ringgroup-${RING_GROUP})
 same => n,GotoIf($[${GROUP_COUNT(ringgroup-${RING_GROUP})} > ${RING_GROUP_LIMIT}]?busy)
 ; correlation header for the answerer side (FreeSWITCH copies X- headers by itself; Asterisk needs this)
 same => n,Set(__SEMI_CALL=${PJSIP_HEADER(read,X-Semishigure-Call)})
 same => n,Set(__SEMI_XLANG=${PJSIP_HEADER(read,X-LANG)})
 same => n,Dial(${RING_GROUP_DIAL},30,b(default^predial^1))
 same => n,Hangup()
exten => _X.,n(busy),Busy(2)
 same => n,Hangup()

; direct extension-to-extension
exten => _X.,n(local),Set(__SEMI_CALL=${PJSIP_HEADER(read,X-Semishigure-Call)})
 same => n,Dial(PJSIP/${EXTEN},30,b(default^predial^1))
 same => n,Hangup()

; pre-dial handler on each B-leg: copy the correlation and X-LANG headers
exten => predial,1,NoOp(predial ${CHANNEL})
 same => n,ExecIf($["${SEMI_CALL}" != ""]?Set(PJSIP_HEADER(add,X-Semishigure-Call)=${SEMI_CALL}))
 same => n,ExecIf($["${SEMI_XLANG}" != ""]?Set(PJSIP_HEADER(add,X-LANG)=${SEMI_XLANG}))
 same => n,Set(PJSIP_HEADER(add,X-LANG-DETECT)=true)
 same => n,Return()

; echo test
exten => 9196,1,Answer()
 same => n,Echo()
 same => n,Hangup()
; tone test (1004 Hz milliwatt for 60 s)
exten => 9197,1,Answer()
 same => n,Milliwatt()
 same => n,Hangup()
