[general]
enabled = yes
webenabled = no
bindaddr = 127.0.0.1
port = 5038
; include the correlation variable in channel events (Newchannel / Hangup)
channelvars = SEMI_CALL

[semishigure]
secret = __AMI_PASSWORD__
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = system,call,command
write = system,call,command
