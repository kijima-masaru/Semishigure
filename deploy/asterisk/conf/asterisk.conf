; Semishigure dev PBX (Asterisk). Paths are replaced by run-native.sh / the Docker entrypoint.
; __DATADIR__ = /usr/share/asterisk on Debian/Ubuntu packages, /var/lib/asterisk for source builds.
[directories]
astetcdir => __CONF__
astmoddir => /usr/lib/x86_64-linux-gnu/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => __DB__
astkeydir => __DATADIR__
astdatadir => __DATADIR__
astagidir => __DATADIR__/agi-bin
astspooldir => __SPOOL__
astrundir => __RUN__
astlogdir => __LOG__
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
maxcalls = __MAXCALLS__
transmit_silence = no
