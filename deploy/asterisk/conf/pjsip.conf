; Semishigure dev PBX: extensions 9100 (caller) and 9001-9004 (answerers).
; Values in __X__ are substituted from environment variables by run-native.sh / the entrypoint.
[transport-udp]
type = transport
protocol = udp
bind = __SIP_IP__:__SIP_PORT__
; external_media_address / external_signaling_address for Docker port-mapping mode
__EXTERNAL__

[endpoint-common](!)
type = endpoint
context = default
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
timers = no
dtmf_mode = rfc4733
; SIP domain (design 9.1): registration and auth use a name, not the IP
from_domain = __DOMAIN__
device_state_busy_at = 0

[auth-common](!)
type = auth
auth_type = userpass
realm = __DOMAIN__

[aor-common](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 0

; ---- caller 9100 ----
[9100](endpoint-common)
auth = 9100
aors = 9100
callerid = "Caller 9100" <9100>
[9100](auth-common)
username = 9100
password = __EXT_PASSWORD__
[9100](aor-common)

; ---- answerers 9001-9004 ----
[9001](endpoint-common)
auth = 9001
aors = 9001
callerid = 9001
[9001](auth-common)
username = 9001
password = __EXT_PASSWORD__
[9001](aor-common)

[9002](endpoint-common)
auth = 9002
aors = 9002
callerid = 9002
[9002](auth-common)
username = 9002
password = __EXT_PASSWORD__
[9002](aor-common)

[9003](endpoint-common)
auth = 9003
aors = 9003
callerid = 9003
[9003](auth-common)
username = 9003
password = __EXT_PASSWORD__
[9003](aor-common)

[9004](endpoint-common)
auth = 9004
aors = 9004
callerid = 9004
[9004](auth-common)
username = 9004
password = __EXT_PASSWORD__
[9004](aor-common)
